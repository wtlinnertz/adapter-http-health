name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest

  conformance:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { path: adapter }

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with: { python-version: "3.11" }

      - name: Install adapter
        run: pip install -e adapter

      - name: Start health fixture server
        run: |
          mkdir -p /tmp/health-fixture && (cd /tmp/health-fixture && touch healthz readyz)
          nohup python3 -m http.server 8080 --bind 127.0.0.1 --directory /tmp/health-fixture > /tmp/health-srv.log 2>&1 &
          echo "AIEOS_FIXTURE_HEALTH_URL=http://127.0.0.1:8080" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break || sleep 0.3; done
          echo "health fixture server ready"

      - name: Run conformance
        id: conformance
        uses: wtlinnertz/aieos-governance-foundation/.github/actions/run-conformance@main
        with:
          adapter-id: adapter-http-health
          adapter-version: "1.0.0"
          python-import: "from aieos_adapter_http_health import HttpHealthAdapter as AdapterClass"
          suite-name: verify.health-suite
          signing-identity: "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main"
          output-path: attestation.json

      - name: Install cosign
        if: steps.conformance.outcome == 'success'
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003
        with: { cosign-release: "v3.0.6" }

      - name: Sign attestation (keyless OIDC)
        if: steps.conformance.outcome == 'success'
        run: cosign sign-blob --bundle attestation.sigstore.json --yes attestation.json

      - name: Upload signed attestation
        if: steps.conformance.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: conformance-attestation
          path: |
            attestation.json
            attestation.sigstore.json
